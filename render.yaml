# Render "Blueprint": la infraestructura descrita como código.
# Render lee este archivo y crea el servicio exactamente así (Infrastructure as Code).
#
# La base de datos NO vive aquí: está en Neon (PostgreSQL gratuito que no vence).
# Las migraciones las aplica GitHub Actions ANTES de que Render despliegue (ver ci.yml).

services:
  - type: web
    name: task-manager-api
    runtime: docker # construye nuestro Dockerfile tal cual
    plan: free
    region: virginia # misma zona que la base de datos en Neon (AWS us-east-1) = menos latencia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health # si no responde 200, Render no manda tráfico a la versión nueva
    autoDeployTrigger: checksPass # solo despliega cuando el CI de GitHub está en verde

    envVars:
      # Se pega a mano en el panel de Render (nunca va en el repositorio).
      - key: DATABASE_URL
        sync: false
      # Render genera un secreto aleatorio: nadie lo conoce, ni siquiera nosotros.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      # En Render la petición atraviesa TRES proxies antes de llegar a la API
      # (medido: X-Forwarded-For llega con 3 entradas, cliente + 2 proxies, y el
      # socket es el tercer proxy). Con 1 o 2, req.ip era la IP de un proxy
      # intermedio (rotaba y el rate limiting no contaba por visitante).
      # Con 3, req.ip es la IP real, y un X-Forwarded-For inventado por el
      # cliente queda a la izquierda y se ignora.
      # Cómo comprobarlo: la "pk" de la cabecera RateLimit-Policy debe ser
      # el hash SHA-256 de la IP pública del cliente (y no cambiar entre peticiones).
      - key: TRUST_PROXY
        value: '3'
      - key: LOG_LEVEL
        value: info
